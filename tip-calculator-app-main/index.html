<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <main class="calculator-container">
      <section class="data-section">
        <form action="#" id="form">
          <div class="input-general-container">
            <label for="bill">Bill</label>
            <div class="input-container">
              <img src="./images/icon-dollar.svg" alt="" />
              <input
                type="number"
                class="input-field"
                name="bill"
                id="bill"
                placeholder="0"
                tabindex="0"
                required
                min="1"
              />
            </div>
          </div>

          <div class="tips-general-container">
            <p class="tips-label">Select Tip %</p>
            <ul class="tips-container" id="tips-container">
              <li
                class="tip-selector"
                id="tip-5"
                data-tip="5"
                role="button"
                tabindex="0"
              >
                5%
              </li>
              <li
                class="tip-selector"
                id="tip-10"
                data-tip="10"
                role="button"
                tabindex="0"
              >
                10%
              </li>
              <li
                class="tip-selector"
                id="tip-15"
                data-tip="15"
                role="button"
                tabindex="0"
              >
                15%
              </li>
              <li
                class="tip-selector"
                id="tip-25"
                data-tip="25"
                role="button"
                tabindex="0"
              >
                25%
              </li>
              <li
                class="tip-selector"
                id="tip-50"
                data-tip="50"
                role="button"
                tabindex="0"
              >
                50%
              </li>
              <input
                type="number"
                class="custom-tip-selector"
                id="custom-tip"
                placeholder="Custom"
                tabindex="0"
                min="1"
              />
            </ul>
          </div>

          <div class="input-general-container">
            <label for="people-num">Number of People</label>
            <div class="input-container">
              <img src="./images/icon-person.svg" alt="" />
              <input
                type="number"
                class="input-field"
                name="people-num"
                id="people-num"
                placeholder="0"
                min="1"
              />
            </div>
          </div>
        </form>
      </section>

      <section class="results-section">
        <div class="amount-container">
          <div class="info-container">
            <p class="title">Tip Amount</p>
            <p class="per-person">/ person</p>
          </div>
          <p class="amount" id="tip-display"></p>
        </div>

        <div class="amount-container">
          <div class="info-container">
            <p class="title">Total</p>
            <p class="per-person">/ person</p>
          </div>
          <p class="amount" id="total-display"></p>
        </div>

        <button
          type="button"
          class="reset-button"
          id="reset-button"
          tabindex="0"
        >
          RESET
        </button>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
