<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <main class="calculator-container">
      <section class="data-section">
        <form action="#" id="form">
          <div class="input-general-container">
            <label for="bill">Bill</label>
            <div class="input-container">
              <img src="./images/icon-dollar.svg" alt="" />
              <input
                type="number"
                class="input-field"
                name="bill"
                id="bill"
                placeholder="0"
                required
              />
            </div>
          </div>

          <div class="buttons-general-container">
            <p class="buttons-label">Select Tip %</p>
            <div class="buttons-container" id="buttons-container">
              <button type="button" class="tip-selector" id="tip-5" value="5">
                5%
              </button>
              <button type="button" class="tip-selector" id="tip-10" value="10">
                10%
              </button>
              <button type="button" class="tip-selector" id="tip-15" value="15">
                15%
              </button>
              <button type="button" class="tip-selector" id="tip-25" value="25">
                25%
              </button>
              <button type="button" class="tip-selector" id="tip-50" value="50">
                50%
              </button>
              <input
                type="number"
                class="custom-tip-selector"
                id="custom-tip"
                placeholder="Custom"
                size="0"
              />
            </div>
          </div>

          <div class="input-general-container">
            <label for="people-num">Number of People</label>
            <div class="input-container">
              <img src="./images/icon-person.svg" alt="" />
              <input
                type="number"
                class="input-field"
                name="people-num"
                id="people-num"
                placeholder="0"
              />
            </div>
          </div>
        </form>
      </section>

      <section class="results-section">
        <div class="amount-container">
          <div class="info-container">
            <p class="title">Tip Amount</p>
            <p class="per-person">/ person</p>
          </div>
          <p class="amount" id="tip-display"></p>
        </div>

        <div class="amount-container">
          <div class="info-container">
            <p class="title">Total</p>
            <p class="per-person">/ person</p>
          </div>
          <p class="total" id="total-display"></p>
        </div>

        <button type="button" class="reset-button" id="reset-button">
          RESET
        </button>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
