<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Tip calculator app</title>
  </head>
  <body>
    <main>
      <section class="data-section">
        <form action="#" id="form">
          <div class="input-general-container">
            <label for="bill">Bill</label>
            <div class="input-container">
              <img src="" alt="" />
              <input
                type="number"
                class="input-field"
                name="bill"
                id="bill"
                value="100"
                required
              />
            </div>
          </div>

          <div class="buttons-container" id="buttons-container">
            <p class="buttons-label">Select Tip %</p>
            <button type="button" class="tip-selector" id="tip-5" value="5">
              5%
            </button>
            <button type="button" class="tip-selector" id="tip-10" value="10">
              10%
            </button>
            <button type="button" class="tip-selector" id="tip-15" value="15">
              15%
            </button>
            <button type="button" class="tip-selector" id="tip-25" value="25">
              25%
            </button>
            <button type="button" class="tip-selector" id="tip-50" value="50">
              50%
            </button>
            <input
              type="number"
              class="custom-tip-selector"
              id="custom-tip"
              placeholder="Custom"
            />
          </div>

          <div class="input-general-container">
            <label for="people-num">Number of People</label>
            <div class="input-container">
              <img src="" alt="" />
              <input
                type="number"
                class="input-field"
                name="people-num"
                id="people-num"
                value="1"
              />
            </div>
          </div>
        </form>
      </section>

      <section class="results-section">
        <div class="amount-container">
          <div class="info-container">
            <p class="title">Tip Amount</p>
            <p class="per-person">/ person</p>
          </div>
          <p class="amount" id="tip-display"></p>
        </div>

        <div class="amount-container">
          <div class="info-container">
            <p class="title">Total</p>
            <p class="per-person">/ person</p>
          </div>
          <p class="total" id="total-display"></p>
        </div>

        <button type="button">Reset</button>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
