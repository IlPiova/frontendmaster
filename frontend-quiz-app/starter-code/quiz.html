<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="./styles/quiz.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend quiz app</title>
  </head>
  <body>
    <header class="category-header" id="category-header">
      <div class="category-card" id="category-card">
        <img src="" alt="" id="category-icon" class="option-image" />
        <p class="answer" id="active-category"></p>
      </div>
      <div class="theme-chooser">
        <img src="" alt="" id="sun-icon" /><input
          type="checkbox"
          name="theme-chooser"
          id="theme-chooser"
        /><img src="" alt="" id="moon-icon" />
      </div>
    </header>
    <!-- main è una griglia di due colonne e 6 righe -->
    <main class="main">
      <section class="question-section">
        <p class="sub-text">
          Question <span class="sub-text" id="question-number"></span>of 10
        </p>
        <p class="question-body" id="question-body"></p>

        <div class="progressbar" role="progressbar" id="progressbar">
          <div class="active-progress-bar" id="active-progress-bar"></div>
        </div>
      </section>
      <section class="options-section">
        <div
          class="option-selector"
          role="checkbox"
          aria-checked="false"
          aria-labelledby="answer-a"
          tabindex="0"
          id="answer-A"
        >
          <div class="answer-index-container">
            <p class="answer-index">A</p>
          </div>
          <p class="answer" id="answer-a"></p>
        </div>
        <div
          class="option-selector"
          role="checkbox"
          aria-checked="false"
          aria-labelledby="answer-b"
          tabindex="0"
          id="answer-B"
        >
          <div class="answer-index-container">
            <p class="answer-index">B</p>
          </div>
          <p class="answer" id="answer-b"></p>
        </div>
        <div
          class="option-selector"
          role="checkbox"
          aria-checked="false"
          aria-labelledby="answer-c"
          tabindex="0"
          id="answer-C"
        >
          <div class="answer-index-container">
            <p class="answer-index">C</p>
          </div>
          <p class="answer" id="answer-c"></p>
        </div>
        <div
          class="option-selector"
          role="checkbox"
          aria-checked="false"
          aria-labelledby="answer-d"
          tabindex="0"
          id="answer-D"
        >
          <div class="answer-index-container">
            <p class="answer-index">D</p>
          </div>
          <p class="answer" id="answer-d"></p>
        </div>
        <button
          type="button"
          class="submit-button"
          id="submit-button"
          data-status="disabled"
        >
          Submit answer
        </button>
      </section>
    </main>
    <script type="module" src="./modules/quizData.js"></script>
    <script type="module" src="./modules/headerConstructor.js"></script>
    <script type="module" src="./modules/handleSubmit.js"></script>
    <script type="module" src="./modules/progressUpdater.js"></script>
  </body>
</html>
