<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header><div>
        <img src="" alt="">
        <p class="answare" id="active-category"></p>
    </div>
<div class="theme-chooser" id="them-chooser">
        <img src="" alt="" /><input type="checkbox" name="" id="" /><img
          src=""
          alt=""
        />
      </div></header>
    <!-- main è una griglia di due colonne e 6 righe -->
    <main class="main">
      <section class="question-section">
        <p class="sub-text">
          Question <span class="sub-text" id="question-number"></span>of 10
        </p>
        <div class="progress-bar" role="progressbar"></div>
        <p class="question-body"></p>
      </section>
      <section class="answare-section">
        <div class="answare" role="checkbox" tabindex="0" id="answare-A">
          <div class="answare-index-container">
            <p class="answare-index">A</p>
          </div>
          <p class="answare"></p>
        </div>
        <div class="answare" role="checkbox" tabindex="0" id="answare-B">
          <div class="answare-index-container">
            <p class="answare-index">B</p>
          </div>
          <p class="answare"></p>
        </div>
        <div class="answare" role="checkbox" tabindex="0" id="answare-C">
          <div class="answare-index-container">
            <p class="answare-index">C</p>
          </div>
          <p class="answare"></p>
        </div>
        <div class="answare" role="checkbox" tabindex="0" id="answare-D">
          <div class="answare-index-container">
            <p class="answare-index">D</p>
          </div>
          <p class="answare"></p>
        </div>
        <button type="button" class="submit-button">Submit answer</button>
      </section>
    </main>
</html>
