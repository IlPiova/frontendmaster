<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend quiz app</title>
  </head>
  <body>
    <header>
      <div>
        <img src="" alt="" id="category-icon" />
        <p class="answare" id="active-category"></p>
      </div>
      <div class="theme-chooser" id="them-chooser">
        <img src="./assets/images/icon-sun-dark.svg" alt="" /><input
          type="checkbox"
          name="theme-chooser"
          id="theme-chooser"
        /><img src="./assets/images/icon-moon-dark.svg" alt="" />
      </div>
    </header>
    <main class="main">
      <section class="title-section">
        <h1>Quiz completed <span class="bold-title"> You scored... </span></h1>
      </section>
      <section class="result-section">
        <div class="result-container">
          <div>
            <img src="" alt="" />
            <p class="answare" id="category"></p>
          </div>
          <p class="result" id="result"></p>
          <p class="sub-text">out of 10</p>
          <button type="button" id="play-again">Play Again</button>
        </div>
      </section>
    </main>
  </body>
</html>
