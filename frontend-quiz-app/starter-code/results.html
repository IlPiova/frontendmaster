<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../starter-code/style.css" />
    <link rel="stylesheet" href="./styles/results.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend quiz app</title>
  </head>
  <body>
    <header class="category-header" id="category-header">
      <div class="category-card" id="category-card">
        <img src="" alt="" id="category-icon" class="option-image" />
        <p class="answer" id="active-category"></p>
      </div>
      <div class="theme-chooser">
        <img src="" alt="" /><input
          type="checkbox"
          name="theme-chooser"
          id="theme-chooser"
        /><img src="" alt="" />
      </div>
    </header>
    <main class="main">
      <section class="title-section">
        <h1>Quiz completed <span class="bold-title"> You scored... </span></h1>
      </section>
      <section class="result-section">
        <div class="result-container">
          <div class="category-card">
            <img src="" alt="" id="category-icon" class="option-image" />
            <p class="answer" id="active-category"></p>
          </div>
          <p class="result" id="result"></p>
          <p class="sub-text">out of 10</p>
        </div>
        <button type="button" id="play-again" class="submit-button">
          Play Again
        </button>
      </section>
    </main>
    <script type="module" src="./modules/resultsModule.js"></script>
    <script type="module" src="./modules/headerConstructor.js"></script>
  </body>
</html>
