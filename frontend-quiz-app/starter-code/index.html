<!doctype html spres>
<html lang="en" color-scheme="" light>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <title>Frontend quiz app</title>
  </head>
  <body>
    <header>
      <div class="theme-chooser" id="them-chooser">
        <img src="" alt="" id="sun-icon" /><input
          type="checkbox"
          name="theme-chooser"
          id="theme-chooser"
        /><img src="" alt="" id="moon-icon" />
      </div>
    </header>
    <main class="main">
      <section class="title-section">
        <h1>Welcome to the <span class="bold-title">Frontend Quiz!</span></h1>
        <p class="sub-text">Pick a subject to get started.</p>
      </section>
      <section class="options-section">
        <div class="option-selector">
          <img
            src="./assets/images/icon-html.svg"
            alt="html-category-icon"
            class="option-image html-icon"
            id="html-icon"
          />
          <a href="./quiz.html" class="answer" id="HTML" tabindex="0">HTML</a>
        </div>
        <div class="option-selector">
          <img
            src="./assets/images/icon-css.svg"
            alt="css-category-icon"
            class="option-image css-icon"
            id="css-icon"
          />
          <a href="./quiz.html" class="answer" id="CSS" tabindex="0">CSS</a>
        </div>
        <div class="option-selector">
          <img
            src="./assets/images/icon-js.svg"
            alt="js-category-icon"
            class="option-image js-icon"
            id="js-icon"
          />
          <a href="./quiz.html" class="answer" id="JavaScript" tabindex="0">
            JavaScript
          </a>
        </div>
        <div class="option-selector">
          <img
            src="./assets/images/icon-accessibility.svg"
            alt="accessibility-category-icon"
            class="option-image accessibility-icon"
            id="accessibility-icon"
          />
          <a href="./quiz.html" class="answer" id="Accessibility" tabindex="0">
            Accessibility
          </a>
        </div>
      </section>
      <script type="module" src="./main.js"></script>
      <script type="module" src="./modules/headerConstructor.js"></script>
    </main>
    <!-- Quiz menu start -->

    <!-- Quiz menu end -->
  </body>
</html>
