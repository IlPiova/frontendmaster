<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Frontend quiz app</title>
  </head>
  <body>
    <header>
      <div class="theme-chooser" id="them-chooser">
        <img src="" alt="" /><input type="checkbox" name="" id="" /><img
          src=""
          alt=""
        />
      </div>
    </header>
    <main class="main">
      <section class="title-section">
        <h1>Welcome to the <span class="bold-title">Frontend Quiz!</span></h1>
        <p class="sub-text">Pick a subject to get started.</p>
      </section>
      <section class="subject-section">
        <div class="subject-sector">
          <img src="" alt="" />
          <p class="answare" id="html" role="checkbox" tabindex="0">HTML</p>
        </div>
        <div class="subject-sector">
          <img src="" alt="" />
          <p class="answare" id="css" role="checkbox" tabindex="0">CSS</p>
        </div>
        <div class="subject-sector">
          <img src="" alt="" />
          <p class="answare" id="js" role="checkbox" tabindex="0">JavaScript</p>
        </div>
        <div class="subject-sector">
          <img src="" alt="" />
          <p class="answare" id="accessibility" role="checkbox" tabindex="0">
            Accessibility
          </p>
        </div>
      </section>
      <script type="module" src="./main.js"></script>
    </main>
    <!-- Quiz menu start -->

    <!-- Quiz menu end -->
  </body>
</html>
