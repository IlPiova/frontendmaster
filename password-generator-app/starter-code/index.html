<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Password generator app</title>
  </head>
  <body>
    <main>
      <h1 class="title">Password Generator</h1>

      <section class="password-container" id="password-container">
        <input
          type="text"
          readonly
          class="password"
          id="password"
          width="0px"
        />
        <p class="copy-message" id="copy-message"></p>
        <button type="button">
          <img
            src="./assets/images/icon-copy.svg"
            alt="copy-text-icon"
            width="17.5px"
            id="copy-icon"
          />
        </button>
      </section>
      <section class="properties-section">
        <form id="form" action="#">
          <div class="range-container">
            <div class="length-container">
              <label for="range" class="text">Character Length</label>
              <p class="psw-length" id="psw-length"></p>
            </div>
            <input
              class="range"
              type="range"
              name="range"
              id="range"
              min="5"
              max="30"
              value="5"
            />
          </div>
          <div class="checkboxes-container" id="checkboxes-container">
            <div class="checkbox-container">
              <input
                type="checkbox"
                name="uppercase"
                id="uppercase"
                class="checkbox"
              />
              <label for="uppercase" class="text"
                >Include Uppercase Letters</label
              >
            </div>

            <div class="checkbox-container">
              <input
                type="checkbox"
                name="lowercase"
                id="lowercase"
                class="checkbox"
              />
              <label for="lowercase" class="text"
                >Include Lowercase Letters</label
              >
            </div>

            <div class="checkbox-container">
              <input
                type="checkbox"
                name="numbers"
                id="numbers"
                class="checkbox"
              />
              <label for="numbers" class="text">Include Numbers</label>
            </div>

            <div class="checkbox-container">
              <input
                type="checkbox"
                name="symbols"
                id="symbols"
                class="checkbox"
              />
              <label for="symbols" class="text">Include Symbols</label>
            </div>
          </div>
        </form>
        <div class="strenght-result-container">
          <p class="strenght-title">STRENGHT</p>
          <div class="result-container">
            <p class="strenght-result" id="strenght-result"></p>
            <div class="indicators-container" id="indicators-container">
              <div class="strenght-indicator"></div>
              <div class="strenght-indicator"></div>
              <div class="strenght-indicator"></div>
              <div class="strenght-indicator"></div>
            </div>
          </div>
        </div>
        <div class="generator-container" id="generate-button">
          <button type="button" class="generate-button">GENERATE</button>
          <img src="./assets/images/icon-arrow-right.svg" alt="" />
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
